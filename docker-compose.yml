version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: garudabeat-db
    environment:
      POSTGRES_DB: safecity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safecity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garudabeat-backend
    environment:
      DATABASE_URL: sqlite:///./safecity.db
      SECRET_KEY: super-secret-key-for-dev-safety-system-2026
      CITY_NAME: "Raipur, Chhattisgarh"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed.seed_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: garudabeat-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

volumes:
  pgdata:
